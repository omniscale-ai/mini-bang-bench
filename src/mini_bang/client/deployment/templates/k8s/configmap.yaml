apiVersion: v1
kind: ConfigMap
metadata:
  name: mini-bang-config
  namespace: $namespace
data:
  MINI_BANG_MODE: k8s-official
  MINI_BANG_BACKEND: k8s
  MINI_BANG_RESULT_STORE: $result_store
  MINI_BANG_RESULT_S3_BUCKET: $s3_bucket
  MINI_BANG_RESULT_S3_PREFIX: $s3_prefix
  MINI_BANG_RESULT_S3_ENDPOINT_URL: $s3_endpoint_url
  MINI_BANG_RESULT_DIR: /payloads/results
  MINI_BANG_K8S_EXECUTABLE_IMAGE: $executable_image
  MINI_BANG_K8S_EXECUTABLE_SERVICE_ACCOUNT: mini-bang-executable
  MINI_BANG_K8S_TTL_SECONDS_AFTER_FINISHED: "300"
  MINI_BANG_K8S_WORKER_MODE: pool
  MINI_BANG_POOL_URL: http://mini-bang-pool:8770
  MINI_BANG_PAYLOAD_MODE: auto
  MINI_BANG_PAYLOAD_STORE: $payload_store
  MINI_BANG_PAYLOAD_S3_BUCKET: $s3_bucket
  MINI_BANG_PAYLOAD_S3_PREFIX: $s3_prefix
  MINI_BANG_PAYLOAD_S3_ENDPOINT_URL: $s3_endpoint_url
  MINI_BANG_PAYLOAD_DIR: /payloads/runtime
$runtime_settings
